<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bundesliga Widget</title>
<style>
  :root{
    --bg-1:#0a0e1a;
    --bg-2:#121a2e;
    --panel:#161f38;
    --panel-alt:#1b2544;
    --line:#26325a;
    --text:#eef1fb;
    --text-dim:#93a0c4;
    --accent:#ff3b4e;
    --accent-2:#ffb347;
    --gold:#ffd166;
    --green:#2ecc71;
    --live:#ff4757;
    --cl-bar:#2ecc71;
    --el-bar:#3fa7ff;
    --relplay-bg:#3a2f0f;
    --rel-bg:#3a1414;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%;
    background:radial-gradient(1200px 800px at 15% -10%, #1a2648 0%, var(--bg-1) 55%) fixed, var(--bg-1);
    color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  .stage{
    width:100vw; height:100vh;
    display:flex; flex-direction:column;
    padding:1.6vh 1.6vw 1.2vh;
  }

  /* ---------- HEADER ---------- */
  .header{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:1.4vh; margin-bottom:1.4vh;
    border-bottom:2px solid var(--line);
    flex-shrink:0;
  }
  .header-left{display:flex; align-items:center; gap:1vw;}
  .badge{
    width:3.6vw; height:3.6vw; min-width:44px; min-height:44px; max-width:56px; max-height:56px;
    border-radius:20%;
    background:#d10214;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 3px rgba(255,59,78,.18), 0 6px 18px rgba(255,59,78,.25);
    flex-shrink:0;
    overflow:hidden;
  }
  .badge img{ width:100%; height:100%; object-fit:contain; display:block; }
  .title-block h1{
    font-size:1.9vw; font-weight:800; letter-spacing:.5px; line-height:1.1;
  }
  .title-block .sub{
    font-size:.95vw; color:var(--text-dim); font-weight:500; margin-top:.2vh;
  }
  .header-right{ text-align:right; }
  .clock{ font-size:1.7vw; font-weight:700; font-variant-numeric:tabular-nums; }
  .date{ font-size:.9vw; color:var(--text-dim); margin-top:.2vh; text-transform:capitalize; }

  /* ---------- GRID ---------- */
  .grid{
    flex:1; min-height:0;
    display:grid;
    grid-template-columns:1.15fr 1.35fr 1.15fr;
    gap:1.4vw;
  }
  .panel{
    background:linear-gradient(180deg, var(--panel) 0%, var(--panel-alt) 100%);
    border:1px solid var(--line);
    border-radius:14px;
    display:flex; flex-direction:column;
    min-height:0;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .panel-head{
    display:flex; align-items:center; gap:.6vw;
    padding:1.3vh 1.2vw;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .panel-head .dot{ width:.6vw; height:.6vw; min-width:8px; min-height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
  .panel-head h2{ font-size:1.15vw; font-weight:700; letter-spacing:.3px; }
  .panel-head .meta{ margin-left:auto; font-size:.8vw; color:var(--text-dim); font-weight:600; }
  .panel-body{ flex:1; min-height:0; overflow:hidden; padding:.4vh .9vw .8vh; display:flex; flex-direction:column; }

  /* ---------- RESULTS / FIXTURES ROWS ---------- */
  .match-row{
    display:grid;
    grid-template-columns:3.6vw 1fr auto 1fr 3.6vw;
    align-items:center;
    gap:.5vw;
    padding:.75vh .3vw;
    border-bottom:1px solid rgba(255,255,255,.05);
    flex:1;
  }
  .match-row:last-child{ border-bottom:none; }
  .crest{ width:2.5vw; height:2.5vw; min-width:26px; min-height:26px; max-width:34px; max-height:34px; object-fit:contain; justify-self:center; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
  .team-name{ font-size:1vw; font-weight:600; line-height:1.15; }
  .team-name.home{ text-align:right; }
  .team-name.away{ text-align:left; }
  .score{
    font-size:1.25vw; font-weight:800; font-variant-numeric:tabular-nums;
    background:rgba(255,255,255,.06);
    padding:.4vh .8vw; border-radius:8px; min-width:4.2vw; text-align:center;
    letter-spacing:1px;
  }
  .score.live{ background:rgba(255,71,87,.18); color:var(--live); position:relative; }
  .live-tag{
    font-size:.62vw; font-weight:800; color:var(--live); letter-spacing:1px;
    display:flex; align-items:center; gap:.3vw; justify-content:center; margin-top:.3vh;
  }
  .live-tag .pulse{ width:.45vw; height:.45vw; min-width:6px; min-height:6px; border-radius:50%; background:var(--live); animation:pulse 1.2s infinite; }
  @keyframes pulse{ 0%{opacity:1;} 50%{opacity:.25;} 100%{opacity:1;} }

  .fixture-time{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:4.2vw; }
  .fixture-time .d{ font-size:.72vw; color:var(--text-dim); font-weight:600; text-transform:uppercase; }
  .fixture-time .t{ font-size:1.05vw; font-weight:800; font-variant-numeric:tabular-nums; }

  /* ---------- TABLE ---------- */
  table.standings{ width:100%; border-collapse:collapse; flex:1; table-layout:fixed; }
  table.standings th{
    text-align:left; font-size:.72vw; color:var(--text-dim); text-transform:uppercase;
    letter-spacing:.5px; font-weight:700; padding:.5vh .3vw; border-bottom:1px solid var(--line);
  }
  table.standings th.num, table.standings td.num{ text-align:center; }
  table.standings td{
    font-size:.92vw; padding:.42vh .3vw; border-bottom:1px solid rgba(255,255,255,.04);
    font-weight:600;
  }
  table.standings th:nth-child(1), table.standings td:nth-child(1){ width:6%; }
  table.standings th:nth-child(2), table.standings td:nth-child(2){ width:33%; }
  table.standings th:nth-child(3), table.standings td:nth-child(3){ width:7%; }
  table.standings th:nth-child(4), table.standings td:nth-child(4){ width:6%; }
  table.standings th:nth-child(5), table.standings td:nth-child(5){ width:6%; }
  table.standings th:nth-child(6), table.standings td:nth-child(6){ width:6%; }
  table.standings th:nth-child(7), table.standings td:nth-child(7){ width:13%; }
  table.standings th:nth-child(8), table.standings td:nth-child(8){ width:11%; }
  table.standings th:nth-child(9), table.standings td:nth-child(9){ width:12%; }
  table.standings tr.pos-bar td:first-child{ position:relative; }
  .pos-cell{ display:flex; align-items:center; gap:.4vw; }
  .pos-num{
    width:1.6vw; height:1.6vw; min-width:20px; min-height:20px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:.85vw; background:rgba(255,255,255,.06);
  }
  tr.cl .pos-num{ background:var(--cl-bar); color:#04150a; }
  tr.el .pos-num{ background:var(--el-bar); color:#04101f; }
  tr.relplay td{ background:rgba(255,209,102,.08); }
  tr.relplay .pos-num{ background:var(--gold); color:#241a02; }
  tr.rel td{ background:rgba(255,59,78,.09); }
  tr.rel .pos-num{ background:var(--accent); color:#fff; }
  .team-cell{ display:flex; align-items:center; gap:.55vw; overflow:hidden; }
  .team-cell img{ width:1.7vw; height:1.7vw; min-width:20px; min-height:20px; object-fit:contain; flex-shrink:0; }
  .team-cell span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  td.pts{ font-weight:800; color:var(--gold); font-size:1vw; }
  td.diff.pos{ color:var(--green); }
  td.diff.neg{ color:var(--accent); }

  .legend{
    display:flex; gap:1vw; flex-wrap:wrap; padding:.8vh 1.2vw 1.1vh; font-size:.68vw; color:var(--text-dim); flex-shrink:0;
    border-top:1px solid var(--line);
  }
  .legend span{ display:flex; align-items:center; gap:.35vw; }
  .legend i{ width:.7vw; height:.7vw; border-radius:3px; display:inline-block; }
  .legend i.cl{ background:var(--cl-bar); }
  .legend i.el{ background:var(--el-bar); }
  .legend i.relplay{ background:var(--gold); }
  .legend i.rel{ background:var(--accent); }

  .empty-state{
    flex:1; display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:.95vw; text-align:center; padding:2vh;
  }

  /* ---------- FOOTER ---------- */
  .footer{
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding-top:1vh; margin-top:1vh; font-size:.72vw; color:var(--text-dim);
  }
  .status{ display:flex; align-items:center; gap:.4vw; }
  .status .sdot{ width:.55vw; height:.55vw; border-radius:50%; background:var(--green); }
  .status.stale .sdot{ background:var(--accent-2); }
  .brand{ font-weight:700; letter-spacing:.5px; opacity:.55; }
  .attribution{ opacity:.5; }

  /* ==================================================================
     MOBILE-LAYOUT (<=860px) – gleicher Breakpoint wie bei den anderen
     FennecAI-Widgets. Auf dem Handy wird NICHT mehr das breite
     Querformat-Design verkleinert (das machte alles winzig), sondern
     komplett auf ein gestapeltes, normal scrollendes Layout mit festen,
     lesbaren Schriftgrößen umgeschaltet.
     ================================================================== */
  @media (max-width:860px){
    html,body{ overflow-y:auto; overflow-x:hidden; height:auto; }
    .stage{ width:100%; height:auto; min-height:100vh; padding:14px 12px 20px; }

    .header{ flex-wrap:wrap; row-gap:8px; padding-bottom:12px; margin-bottom:12px; }
    .badge{ width:44px; height:44px; }
    .title-block h1{ font-size:20px; }
    .title-block .sub{ font-size:11px; }
    .header-right{ text-align:right; }
    .clock{ font-size:18px; }
    .date{ font-size:10.5px; }

    .grid{ display:flex; flex-direction:column; gap:16px; }
    .panel{ box-shadow:none; }
    .panel-head{ padding:11px 14px; }
    .panel-head h2{ font-size:15px; }
    .panel-head .meta{ font-size:10.5px; }
    .panel-head .dot{ width:7px; height:7px; }
    .panel-body{ flex:none; overflow:visible; padding:2px 10px 8px; }

    /* Ergebnisse / Spielplan */
    .match-row{ grid-template-columns:34px 1fr auto 1fr 34px; gap:8px; padding:9px 2px; }
    .crest{ width:26px; height:26px; }
    .team-name{ font-size:12.5px; }
    .score{ font-size:14px; padding:4px 9px; min-width:44px; }
    .live-tag{ font-size:9px; }
    .fixture-time{ min-width:44px; }
    .fixture-time .d{ font-size:9.5px; }
    .fixture-time .t{ font-size:12px; }

    /* Tabelle: eigene Spalten ausblenden, nur die wichtigsten zeigen
       (#, Verein, Tordifferenz, Punkte) – sonst zu eng auf dem Handy.
       Zusätzlich horizontal scrollbar als Sicherheitsnetz. */
    #tableBody{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table.standings{ min-width:0; table-layout:auto; }
    table.standings th:nth-child(3), table.standings td:nth-child(3),
    table.standings th:nth-child(4), table.standings td:nth-child(4),
    table.standings th:nth-child(5), table.standings td:nth-child(5),
    table.standings th:nth-child(6), table.standings td:nth-child(6),
    table.standings th:nth-child(7), table.standings td:nth-child(7){
      display:none;
    }
    table.standings th:nth-child(1), table.standings td:nth-child(1){ width:auto; }
    table.standings th:nth-child(2), table.standings td:nth-child(2){ width:auto; }
    table.standings th:nth-child(8), table.standings td:nth-child(8){ width:auto; }
    table.standings th:nth-child(9), table.standings td:nth-child(9){ width:auto; }
    table.standings th{ font-size:10px; padding:7px 6px; }
    table.standings td{ font-size:12.5px; padding:8px 6px; }
    .pos-num{ width:20px; height:20px; font-size:11px; }
    .team-cell img{ width:20px; height:20px; }
    .team-cell span{ white-space:normal; }
    td.pts{ font-size:13px; }
    .legend{ font-size:10px; gap:10px 14px; padding:8px 14px 10px; }
    .legend i{ width:8px; height:8px; }

    .footer{ flex-wrap:wrap; justify-content:center; gap:4px 14px; text-align:center; font-size:10.5px; }
  }
</style>
</head>

<script>
(function(){
  "use strict";

  var API = "https://api.openligadb.de";
  var LEAGUE = "bl1";
  var REFRESH_MS = 5 * 60 * 1000;   // Datenaktualisierung alle 5 Minuten
  var CLOCK_MS = 1000;
  var FETCH_TIMEOUT_MS = 12000;
  var CACHE_KEY = "bl1_widget_cache_v1";

  var CREST_FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#26325a"/><text x="20" y="26" font-size="16" text-anchor="middle" fill="#93a0c4" font-family="sans-serif">?</text></svg>'
  );

  function withTimeout(promise, ms){
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, ms);
    return { controller: controller, clear: function(){ clearTimeout(timer); } };
  }

  function fetchJson(url){
    var t = withTimeout(null, FETCH_TIMEOUT_MS);
    return fetch(url, { cache: "no-store", signal: t.controller.signal })
      .then(function(res){
        t.clear();
        if(!res.ok) throw new Error("HTTP " + res.status + " bei " + url);
        return res.json();
      })
      .catch(function(err){ t.clear(); throw err; });
  }

  function saveCache(data){
    try{
      localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: data }));
    }catch(e){ /* Speicher evtl. nicht verfuegbar - ignorieren */ }
  }

  function loadCache(){
    try{
      var raw = localStorage.getItem(CACHE_KEY);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ return null; }
  }

  function setStatus(ok, ts){
    var row = document.getElementById("statusRow");
    var text = document.getElementById("statusText");
    var d = new Date(ts);
    var timeStr = d.toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" });
    if(ok){
      row.className = "status";
      text.textContent = "Aktualisiert um " + timeStr + " Uhr";
    } else {
      row.className = "status stale";
      text.textContent = "Zuletzt erfolgreich: " + timeStr + " Uhr (Cache)";
    }
  }

  function fmtDate(dt){
    return dt.toLocaleDateString("de-DE", { weekday:"short", day:"2-digit", month:"2-digit" });
  }
  function fmtTime(dt){
    return dt.toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" });
  }

  function finalScore(match){
    var results = match.matchResults || [];
    var finalRes = null;
    for(var i=0;i<results.length;i++){
      if(results[i].resultTypeID === 2) finalRes = results[i];
    }
    if(!finalRes && results.length) finalRes = results[results.length-1];
    if(finalRes) return { t1: finalRes.pointsTeam1, t2: finalRes.pointsTeam2 };
    var goals = match.goals || [];
    if(goals.length){
      var last = goals[goals.length-1];
      return { t1: last.scoreTeam1, t2: last.scoreTeam2 };
    }
    return { t1: 0, t2: 0 };
  }

  function isLive(match){
    if(match.matchIsFinished) return false;
    var kick = new Date(match.matchDateTimeUTC || match.matchDateTime);
    var elapsed = Date.now() - kick.getTime();
    return elapsed > 0 && elapsed < (3 * 60 * 60 * 1000); // innerhalb von 3h nach Anstoss
  }

  function crestImg(url, alt, cls){
    var img = document.createElement("img");
    img.src = url || CREST_FALLBACK;
    img.alt = alt || "";
    img.loading = "lazy";
    img.className = cls || "crest";
    img.onerror = function(){ this.onerror = null; this.src = CREST_FALLBACK; };
    return img;
  }

  function renderResults(matches){
    var body = document.getElementById("resultsBody");
    body.innerHTML = "";
    if(!matches || !matches.length){
      body.innerHTML = '<div class="empty-state">Noch keine Ergebnisse verf&uuml;gbar</div>';
      return;
    }
    var meta = document.getElementById("resultsMeta");
    meta.textContent = matches[0] && matches[0].group ? matches[0].group.groupName : "";

    matches.forEach(function(m){
      var row = document.createElement("div");
      row.className = "match-row";

      var home = crestImg(m.team1.teamIconUrl, m.team1.teamName, "crest");
      var away = crestImg(m.team2.teamIconUrl, m.team2.teamName, "crest");

      var homeName = document.createElement("div");
      homeName.className = "team-name home";
      homeName.textContent = m.team1.shortName || m.team1.teamName;

      var awayName = document.createElement("div");
      awayName.className = "team-name away";
      awayName.textContent = m.team2.shortName || m.team2.teamName;

      var scoreWrap = document.createElement("div");
      scoreWrap.style.display = "flex";
      scoreWrap.style.flexDirection = "column";
      scoreWrap.style.alignItems = "center";

      var live = isLive(m);
      var sc = finalScore(m);
      var scoreEl = document.createElement("div");
      scoreEl.className = "score" + (live ? " live" : "");
      if(m.matchIsFinished || live){
        scoreEl.textContent = sc.t1 + " : " + sc.t2;
      } else {
        scoreEl.textContent = "– : –";
      }
      scoreWrap.appendChild(scoreEl);

      if(live){
        var tag = document.createElement("div");
        tag.className = "live-tag";
        tag.innerHTML = '<span class="pulse"></span>LIVE';
        scoreWrap.appendChild(tag);
      }

      row.appendChild(home);
      row.appendChild(homeName);
      row.appendChild(scoreWrap);
      row.appendChild(awayName);
      row.appendChild(away);
      body.appendChild(row);
    });
  }

  function renderFixtures(matches){
    var body = document.getElementById("fixturesBody");
    body.innerHTML = "";
    if(!matches || !matches.length){
      body.innerHTML = '<div class="empty-state">Keine kommenden Spiele gefunden</div>';
      return;
    }
    var meta = document.getElementById("fixturesMeta");
    meta.textContent = matches[0] && matches[0].group ? matches[0].group.groupName : "";

    matches.forEach(function(m){
      var row = document.createElement("div");
      row.className = "match-row";

      var home = crestImg(m.team1.teamIconUrl, m.team1.teamName, "crest");
      var away = crestImg(m.team2.teamIconUrl, m.team2.teamName, "crest");

      var homeName = document.createElement("div");
      homeName.className = "team-name home";
      homeName.textContent = m.team1.shortName || m.team1.teamName;

      var awayName = document.createElement("div");
      awayName.className = "team-name away";
      awayName.textContent = m.team2.shortName || m.team2.teamName;

      var dt = new Date(m.matchDateTime);
      var timeWrap = document.createElement("div");
      timeWrap.className = "fixture-time";
      var dEl = document.createElement("div");
      dEl.className = "d";
      dEl.textContent = fmtDate(dt);
      var tEl = document.createElement("div");
      tEl.className = "t";
      tEl.textContent = fmtTime(dt) + " Uhr";
      timeWrap.appendChild(dEl);
      timeWrap.appendChild(tEl);

      row.appendChild(home);
      row.appendChild(homeName);
      row.appendChild(timeWrap);
      row.appendChild(awayName);
      row.appendChild(away);
      body.appendChild(row);
    });
  }

  function rowClass(pos){
    if(pos === 1) return "cl";
    if(pos >= 2 && pos <= 6) return "el";
    if(pos === 16) return "relplay";
    if(pos >= 17) return "rel";
    return "";
  }

  function renderTable(table){
    var body = document.getElementById("tableBody");
    body.innerHTML = "";
    if(!table || !table.length){
      body.innerHTML = '<div class="empty-state">Tabelle nicht verf&uuml;gbar</div>';
      return;
    }
    var meta = document.getElementById("tableMeta");
    meta.textContent = table.length + " Vereine";

    var wrap = document.createElement("div");
    wrap.style.flex = "1";
    wrap.style.minHeight = "0";
    wrap.style.display = "flex";
    wrap.style.flexDirection = "column";

    var t = document.createElement("table");
    t.className = "standings";
    t.innerHTML =
      '<thead><tr>' +
      '<th class="num">#</th><th>Verein</th>' +
      '<th class="num">Sp</th><th class="num">S</th><th class="num">U</th><th class="num">N</th>' +
      '<th class="num">Tore</th><th class="num">Diff</th><th class="num">Pkt</th>' +
      '</tr></thead>';
    var tbody = document.createElement("tbody");

    table.forEach(function(team, idx){
      var pos = idx + 1;
      var tr = document.createElement("tr");
      var rc = rowClass(pos);
      if(rc) tr.className = rc;

      var tdPos = document.createElement("td");
      var posCell = document.createElement("div");
      posCell.className = "pos-cell";
      var posNum = document.createElement("div");
      posNum.className = "pos-num";
      posNum.textContent = pos;
      posCell.appendChild(posNum);
      tdPos.appendChild(posCell);

      var tdTeam = document.createElement("td");
      var teamCell = document.createElement("div");
      teamCell.className = "team-cell";
      teamCell.appendChild(crestImg(team.teamIconUrl, team.teamName, ""));
      var nameSpan = document.createElement("span");
      nameSpan.textContent = team.shortName || team.teamName;
      teamCell.appendChild(nameSpan);
      tdTeam.appendChild(teamCell);

      var tdSp = document.createElement("td"); tdSp.className="num"; tdSp.textContent = team.matches;
      var tdS = document.createElement("td"); tdS.className="num"; tdS.textContent = team.won;
      var tdU = document.createElement("td"); tdU.className="num"; tdU.textContent = team.draw;
      var tdN = document.createElement("td"); tdN.className="num"; tdN.textContent = team.lost;
      var tdTore = document.createElement("td"); tdTore.className="num"; tdTore.textContent = team.goals + ":" + team.opponentGoals;
      var tdDiff = document.createElement("td");
      tdDiff.className = "num diff " + (team.goalDiff > 0 ? "pos" : (team.goalDiff < 0 ? "neg" : ""));
      tdDiff.textContent = (team.goalDiff > 0 ? "+" : "") + team.goalDiff;
      var tdPts = document.createElement("td"); tdPts.className="num pts"; tdPts.textContent = team.points;

      tr.appendChild(tdPos);
      tr.appendChild(tdTeam);
      tr.appendChild(tdSp);
      tr.appendChild(tdS);
      tr.appendChild(tdU);
      tr.appendChild(tdN);
      tr.appendChild(tdTore);
      tr.appendChild(tdDiff);
      tr.appendChild(tdPts);
      tbody.appendChild(tr);
    });

    t.appendChild(tbody);
    wrap.appendChild(t);
    body.appendChild(wrap);
  }

  function renderAll(payload){
    renderResults(payload.results);
    renderTable(payload.table);
    renderFixtures(payload.fixtures);
    var seasonLabel = document.getElementById("seasonLabel");
    if(payload.season){
      seasonLabel.textContent = "Saison " + payload.season + "/" + (parseInt(payload.season,10)+1);
    }
  }

  function allFinished(matches){
    return matches.length > 0 && matches.every(function(m){ return m.matchIsFinished; });
  }
  function noneFinished(matches){
    return matches.length > 0 && matches.every(function(m){ return !m.matchIsFinished; });
  }

  function loadData(){
    fetchJson(API + "/getmatchdata/" + LEAGUE)
      .then(function(current){
        if(!current || !current.length) throw new Error("Keine aktuellen Spieltag-Daten");
        var season = current[0].leagueSeason;
        var groupId = current[0].group.groupOrderID;

        var resultsPromise, fixturesPromise;

        if(allFinished(current)){
          resultsPromise = Promise.resolve(current);
          fixturesPromise = fetchJson(API + "/getmatchdata/" + LEAGUE + "/" + season + "/" + (groupId+1)).catch(function(){ return []; });
        } else if(noneFinished(current)){
          fixturesPromise = Promise.resolve(current);
          resultsPromise = groupId > 1
            ? fetchJson(API + "/getmatchdata/" + LEAGUE + "/" + season + "/" + (groupId-1)).catch(function(){ return []; })
            : Promise.resolve([]);
        } else {
          // gemischt: Spieltag laeuft gerade
          resultsPromise = Promise.resolve(current);
          fixturesPromise = fetchJson(API + "/getmatchdata/" + LEAGUE + "/" + season + "/" + (groupId+1)).catch(function(){ return []; });
        }

        var tablePromise = fetchJson(API + "/getbltable/" + LEAGUE + "/" + season);

        return Promise.all([resultsPromise, fixturesPromise, tablePromise]).then(function(vals){
          return { results: vals[0], fixtures: vals[1], table: vals[2], season: season };
        });
      })
      .then(function(payload){
        renderAll(payload);
        saveCache(payload);
        setStatus(true, Date.now());
      })
      .catch(function(err){
        console.warn("Bundesliga-Widget: Live-Abruf fehlgeschlagen, nutze Cache falls vorhanden.", err);
        var cached = loadCache();
        if(cached && cached.data){
          renderAll(cached.data);
          setStatus(false, cached.ts);
        } else {
          setStatus(false, Date.now());
          document.getElementById("statusText").textContent = "Keine Verbindung – warte auf Daten…";
        }
      });
  }

  function tickClock(){
    var now = new Date();
    document.getElementById("clock").textContent = fmtTime(now) + " Uhr";
    document.getElementById("dateLabel").textContent = now.toLocaleDateString("de-DE", { weekday:"long", day:"2-digit", month:"long", year:"numeric" });
  }

  document.addEventListener("DOMContentLoaded", function(){
    var cached = loadCache();
    if(cached && cached.data){
      renderAll(cached.data);
      setStatus(false, cached.ts);
    }
    tickClock();
    setInterval(tickClock, CLOCK_MS);
    loadData();
    setInterval(loadData, REFRESH_MS);
  });

})();
</script>
</body>
</html>
