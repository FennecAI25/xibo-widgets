<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>News International</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --blue-dark: #071525;
  --blue-mid:  #0d2340;
  --blue:      #1a4a8a;
  --accent:    #2e7dd1;
  --light:     #5aa3f0;
  --gold:      #f0b429;
  --text:      #ffffff;
  --muted:     rgba(255,255,255,0.65);
}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}

#app{
  width:1920px;height:1080px;
  transform-origin:top left;
  position:relative;overflow:hidden;
  font-family:'Barlow',sans-serif;
  background:var(--blue-dark);
}

/* ── TOP BAR (immer sichtbar, unabhängig vom Slide) ── */
.topbar{
  position:absolute;top:0;left:0;right:0;height:80px;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 60px;
  background:linear-gradient(180deg, rgba(7,21,37,0.98) 0%, rgba(7,21,37,0.0) 100%);
  border-bottom:2px solid var(--accent);
}
.topbar-date{
  font-family:'Barlow Condensed',sans-serif;
  font-size:28px;font-weight:600;color:var(--muted);letter-spacing:2px;
  width:340px;
}
.topbar-logo{
  display:flex;align-items:center;gap:14px;
}
.logo-box{
  background:var(--accent);
  padding:6px 16px;border-radius:6px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:32px;font-weight:900;color:#fff;letter-spacing:1px;
}
.logo-text{
  font-family:'Barlow Condensed',sans-serif;
  font-size:32px;font-weight:400;color:var(--text);letter-spacing:3px;
  text-transform:uppercase;
}
.topbar-time{
  font-family:'Barlow Condensed',sans-serif;
  font-size:28px;font-weight:600;color:var(--text);letter-spacing:3px;
  width:340px;text-align:right;
}

/* ── STAGE (ein komplettes Slide-Objekt: Bild+Overlay+Text+Meta) ── */
#stage-wrap{
  position:absolute;top:80px;left:0;right:0;bottom:48px;z-index:10;
  overflow:hidden;
}
.stage{
  position:absolute;inset:0;
  transition:transform 1200ms cubic-bezier(.65,0,.35,1);
  will-change:transform;
}
.stage.pos-current{ transform:translateX(0%); z-index:2; }
.stage.pos-next{ transform:translateX(100%); z-index:1; }
.stage.pos-out{ transform:translateX(-100%); z-index:2; }

.stage-bg{
  position:absolute;inset:0;z-index:0;
  background-size:cover;background-position:center;
}
.stage-bg::after{
  content:'';position:absolute;inset:0;
  background:
    linear-gradient(to right,
      rgba(7,21,37,0.95) 0%,
      rgba(7,21,37,0.82) 38%,
      rgba(7,21,37,0.35) 68%,
      rgba(7,21,37,0.12) 100%),
    linear-gradient(to top,
      rgba(7,21,37,0.55) 0%,
      transparent 30%);
}
.stage[dir="rtl"] .stage-bg::after{
  background:
    linear-gradient(to left,
      rgba(7,21,37,0.95) 0%,
      rgba(7,21,37,0.82) 38%,
      rgba(7,21,37,0.35) 68%,
      rgba(7,21,37,0.12) 100%),
    linear-gradient(to top,
      rgba(7,21,37,0.55) 0%,
      transparent 30%);
}

.source-pill{
  position:absolute;top:34px;left:60px;z-index:5;
  display:flex;align-items:center;gap:10px;
}
.stage[dir="rtl"] .source-pill{ left:auto;right:60px; }
.source-name{
  background:var(--accent);
  padding:6px 20px;border-radius:4px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:18px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#fff;
  box-shadow:0 4px 20px rgba(46,125,209,0.4);
}
.lang-badge{
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px;font-weight:700;letter-spacing:2px;
  color:var(--light);
  border:1px solid rgba(90,163,240,0.5);
  padding:5px 12px;border-radius:3px;
  text-transform:uppercase;
  background:rgba(7,21,37,0.4);
}

/* ── TEXT ZONE — komfortable Breite, Bild bleibt Hero-Element ── */
.text-zone{
  position:absolute;
  left:60px;bottom:70px;
  width:min(56%, 1180px);
  z-index:5;
}
.stage[dir="rtl"] .text-zone{
  left:auto;right:60px;text-align:right;
}
.news-category{
  font-family:'Barlow',sans-serif;
  font-size:23px;font-weight:700;letter-spacing:4px;
  text-transform:uppercase;color:var(--gold);
  margin-bottom:16px;
}
.stage[dir="rtl"] .news-category{ letter-spacing:1px; }
.news-title{
  font-family:'Barlow',sans-serif;
  font-size:72px;font-weight:800;line-height:1.12;
  color:#ffffff;margin-bottom:22px;
  text-shadow:0 2px 30px rgba(0,0,0,0.7);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  letter-spacing:-0.3px;
}
.stage[lang="zh"] .news-title{ letter-spacing:0; line-height:1.35; font-weight:700; }
.stage[dir="rtl"] .news-title{ letter-spacing:0; font-family:'Noto Sans Arabic','Barlow',sans-serif; }
.stage[lang="zh"] .news-title, .stage[lang="zh"] .news-desc{ font-family:'Noto Sans SC','Barlow',sans-serif; }

.news-desc{
  font-size:26px;font-weight:400;line-height:1.6;
  color:#ffffff;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 1px 16px rgba(0,0,0,0.85);
}
.news-meta{
  margin-top:20px;display:flex;align-items:center;gap:16px;
}
.stage[dir="rtl"] .news-meta{ flex-direction:row-reverse; }
.news-date{
  font-size:15px;color:rgba(255,255,255,0.4);letter-spacing:1px;
  direction:ltr;unicode-bidi:embed;display:inline-block; /* Datum bleibt intern korrekt sortiert, auch in RTL-Slides */
}
/* ── BOTTOM BAR (immer sichtbar) ── */
.bottom-bar{
  position:absolute;bottom:0;left:0;right:0;height:48px;z-index:50;
  background:rgba(7,21,37,0.95);border-top:1px solid rgba(46,125,209,0.3);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 60px;
}
.bottom-source-line{font-size:11px;color:rgba(255,255,255,0.3);}
.bottom-right{display:flex;align-items:center;gap:16px;}
.dots{display:flex;gap:8px;}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);transition:background .3s;}
.dot.active{background:var(--accent);box-shadow:0 0 8px rgba(46,125,209,0.6);}
.bottom-counter{font-family:'Barlow Condensed',sans-serif;font-size:15px;color:rgba(255,255,255,0.45);letter-spacing:1px;}

.progress-track{
  position:absolute;bottom:48px;left:0;right:0;height:3px;z-index:40;
  background:rgba(46,125,209,0.15);
}
.progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--blue),var(--accent),var(--light));
  box-shadow:0 0 12px rgba(90,163,240,0.6);
}

/* ── VERBINDUNGSHINWEIS — nur beim allerersten Laden, dezent, kein Alarm-Look ── */
#connecting{
  display:none;position:absolute;inset:0;z-index:999;
  background:var(--blue-dark);
  flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
#connecting.visible{display:flex;}
.connecting-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:0.3;}50%{opacity:1;}}
.connecting-text{font-family:'Barlow Condensed',sans-serif;font-size:20px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="topbar-date" id="topDate">--.--.----</div>
    <div class="topbar-logo">
      <div class="logo-box">NEWS</div>
      <div class="logo-text">International</div>
    </div>
    <div class="topbar-time" id="topTime">--:--:--</div>
  </div>

  <div id="stage-wrap">
    <div id="connecting">
      <div class="connecting-dot"></div>
      <div class="connecting-text">Verbindung wird aufgebaut</div>
    </div>
    <!-- stageA / stageB werden per JS befüllt und rotieren die Rollen current/next -->
    <div class="stage pos-current" id="stageA"></div>
    <div class="stage pos-next" id="stageB"></div>
  </div>

  <div class="progress-track"><div class="progress-fill" id="pbar"></div></div>

  <div class="bottom-bar">
    <div class="bottom-source-line">Alle Angaben ohne Gewähr · Quelle je Meldung siehe Kennzeichnung im Bild</div>
    <div class="bottom-right">
      <div class="dots" id="dots"></div>
      <div class="bottom-counter" id="counter">1 / 5</div>
    </div>
  </div>

</div>
<script>
var DAYS   = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var MONTHS_SHORT = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

var PROXY_URL   = 'https://eumatec-germany.de/news-proxy-v2.php';
var REFRESH_MS  = 600000;   // Datensatz-Refresh (Backend-Cache-TTL beachten)
var SLIDE_MS    = 10000;    // Anzeigedauer pro Slide
var TRANSITION_MS = 1200;   // muss zur CSS transition-duration passen

var news = [];          // aktueller, zuletzt erfolgreich geladener Datensatz (fail-silent gehalten)
var cur = 0;
var stages = { current: document.getElementById('stageA'), next: document.getElementById('stageB') };
var autoTimer = null;
var everLoaded = false;
var preloadedImg = {};  // cache: url -> Image()

// ── CLOCK ──
function tick(){
  var n=new Date();
  var d=('0'+n.getDate()).slice(-2)+'.'+('0'+(n.getMonth()+1)).slice(-2)+'.'+n.getFullYear();
  document.getElementById('topDate').textContent=DAYS[n.getDay()]+', '+d;
  document.getElementById('topTime').textContent=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2)+':'+('0'+n.getSeconds()).slice(-2);
}
setInterval(tick,1000); tick();

function fmtDate(s){
  if(!s) return '';
  try{
    var d=new Date(s);
    if(isNaN(d.getTime())) return '';
    return ('0'+d.getDate()).slice(-2)+'. '+MONTHS_SHORT[d.getMonth()]+' '+d.getFullYear()+' · '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+' Uhr';
  }catch(e){return '';}
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/** Baut den kompletten HTML-Inhalt EINES Slides (alles zusammen = ein visuelles Objekt)
 *  Hinweis: der frühere Redaktions-Hinweis-Badge wurde bewusst entfernt -- die
 *  serverseitige Textverarbeitung bleibt bestehen, ist für den Betrachter aber kein
 *  sichtbares technisches Detail mehr. Quelle/Kategorie/Headline/Summary/Datum
 *  bleiben unverändert sichtbar. */
function renderSlideHtml(n){
  return ''
    + '<div class="stage-bg" style="' + (n.image ? 'background-image:url(\'' + n.image.replace(/'/g,"") + '\')' : '') + '"></div>'
    + '<div class="source-pill">'
    +   '<div class="source-name">' + escapeHtml(n.source||'') + '</div>'
    +   '<div class="lang-badge">' + escapeHtml(n.langLabel||'') + '</div>'
    + '</div>'
    + '<div class="text-zone">'
    +   '<div class="news-category">' + escapeHtml(n.category||'AKTUELL') + '</div>'
    +   '<div class="news-title">' + escapeHtml(n.title||'') + '</div>'
    +   '<div class="news-desc">' + escapeHtml(n.desc||'') + '</div>'
    +   '<div class="news-meta">'
    +     '<div class="news-date">' + fmtDate(n.pubDate) + '</div>'
    +   '</div>'
    + '</div>';
}

function applySlide(stageEl, n){
  stageEl.innerHTML = renderSlideHtml(n);
  stageEl.setAttribute('dir', n.dir || 'ltr');
  stageEl.setAttribute('lang', n.lang || 'de');
}

function preloadImage(url){
  if(!url || preloadedImg[url]) return;
  var img = new Image();
  img.src = url;
  preloadedImg[url] = img;
  // Speicher-Hygiene für sehr lange, durchgehende Xibo-Laufzeiten (Wochen/Monate ohne Reload):
  // Cache-Objekt begrenzen, damit es nicht unbegrenzt wächst. Bereits gerenderte Bilder
  // bleiben im normalen Browser-Bildcache -- hier geht es nur um die JS-Referenzliste.
  var keys = Object.keys(preloadedImg);
  if(keys.length > 60){ delete preloadedImg[keys[0]]; }
}

function renderDots(){
  var el=document.getElementById('dots'); el.innerHTML='';
  news.forEach(function(_,i){
    var d=document.createElement('div');
    d.className='dot'+(i===cur?' active':'');
    el.appendChild(d);
  });
}

function startProgress(){
  var bar=document.getElementById('pbar');
  bar.style.transition='none'; bar.style.width='0%';
  setTimeout(function(){ bar.style.transition='width '+SLIDE_MS+'ms linear'; bar.style.width='100%'; },60);
}

/** Zeigt den allerersten Slide direkt (ohne Transition-Animation) */
function showFirst(){
  if(!news.length) return;
  cur = 0;
  applySlide(stages.current, news[0]);
  stages.current.className = 'stage pos-current';
  stages.next.className = 'stage pos-next';
  if(news[1]) { applySlide(stages.next, news[1]); preloadImage(news[1].image); }
  document.getElementById('counter').textContent = '1 / ' + news.length;
  renderDots();
  startProgress();
  preloadImage(news[0].image);
}

/** Rückt eine Position weiter: die vorbereitete "next"-Stage wird zur "current"-Stage */
function advance(){
  if(!news.length) return;
  var nextIndex = (cur+1) % news.length;
  var afterIndex = (nextIndex+1) % news.length;

  // Beide Stages gemeinsam bewegen -> EIN visuelles Objekt
  stages.current.className = 'stage pos-out';
  stages.next.className = 'stage pos-current';

  setTimeout(function(){
    // Rollen tauschen, alte "current" wird zur neuen "next" und sofort (ohne Transition) rechts positioniert
    var tmp = stages.current;
    stages.current = stages.next;
    stages.next = tmp;

    stages.next.style.transition = 'none';
    stages.next.className = 'stage pos-next';
    // reflow erzwingen, damit die nächste Transition wieder greift
    void stages.next.offsetWidth;
    stages.next.style.transition = '';

    cur = nextIndex;
    document.getElementById('counter').textContent = (cur+1) + ' / ' + news.length;
    renderDots();
    startProgress();

    // nächsten Slide (der übernächste in der Rotation) bereits vorbereiten + Bild vorladen
    if(news[afterIndex]){
      applySlide(stages.next, news[afterIndex]);
      preloadImage(news[afterIndex].image);
    }
  }, TRANSITION_MS);
}

function startAuto(){
  if(autoTimer) clearInterval(autoTimer);
  autoTimer = setInterval(advance, SLIDE_MS);
}

// ── LOAD (fail-silent: alter Datensatz bleibt aktiv, wenn Refresh fehlschlägt) ──
function loadNews(){
  fetch(PROXY_URL, {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(data){
      if(!data.items || !data.items.length) return; // leeres/ungültiges Ergebnis -> altes Dataset einfach behalten
      news = data.items;
      document.getElementById('connecting').classList.remove('visible');
      if(!everLoaded){
        everLoaded = true;
        showFirst();
        startAuto();
      }
      // Läuft die Rotation schon, wird der neue Datensatz beim nächsten vollen Zyklus automatisch sichtbar,
      // weil "news" ausgetauscht ist -- keine harte Unterbrechung der laufenden Anzeige.
    })
    .catch(function(e){
      console.error('news-proxy fetch failed, keeping last known-good dataset:', e);
      // Bewusst KEIN Error-Overlay -- der Screen bleibt mit dem letzten guten Stand stehen.
      if(!everLoaded){
        // Sonderfall: der ALLERERSTE Ladeversuch ist fehlgeschlagen -- es gibt noch keinen
        // Datensatz zum Anzeigen. Statt bis zum nächsten regulären Refresh (10 Min) zu warten,
        // schneller erneut versuchen, damit der Screen zügig aus dem Verbindungshinweis kommt.
        setTimeout(loadNews, 15000);
      }
    });
}

function scale(){
  var s=Math.min(window.innerWidth/1920, window.innerHeight/1080);
  document.getElementById('app').style.transform='scale('+s+')';
}
window.addEventListener('resize', scale); scale();

// Beim allerersten Laden (noch nie Daten) einen dezenten Verbindungshinweis zeigen
document.getElementById('connecting').classList.add('visible');

loadNews();
setInterval(loadNews, REFRESH_MS);
</script>
</body>
</html>
